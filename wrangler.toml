#:schema node_modules/wrangler/config-schema.json

name = "manamurah-mcp-server"
main = "src/index.ts"
compatibility_date = "2025-04-22"
compatibility_flags = ["nodejs_compat"]

# Upstream proxy base URL. This Worker holds no credentials — every
# request is forwarded to manamurah.com/api/v2/mcp/* which is
# already public + edge-cached.
[vars]
MANAMURAH_API_BASE = "https://manamurah.com"

# Custom domain binding — mcp.manamurah.com → this Worker.
[[routes]]
pattern = "mcp.manamurah.com"
custom_domain = true

# Workers Analytics Engine — MCP protocol-boundary usage telemetry.
# One 100%-sampled datapoint per JSON-RPC request (initialize / tools/list /
# tools/call). Schema is documented in src/analytics.ts. The dataset is
# created implicitly on first write. No tool arguments or response payloads
# are ever recorded — tool name, outcome, latency, client + UA only.
[[analytics_engine_datasets]]
binding = "WAE"
dataset = "manamurah_mcp"

# Environment variants (inherit [vars] unless overridden).
[env.staging]
name = "manamurah-mcp-server-staging"

[env.development]
name = "manamurah-mcp-server-dev"
